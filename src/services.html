<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="meta.services.title">LINKERPARTNERS</title>
    <meta name="description" content="" data-i18n-attr="content:meta.services.description" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="assets/logo/favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        var d = document.documentElement;
        d.classList.add("js");
        // 이 창에서 처음이면 인트로, 사이트 안에서 넘어왔으면 전환 막. 동작 줄이기 설정이면 둘 다 생략
        try {
          var still = matchMedia("(prefers-reduced-motion: reduce)").matches;
          if (!sessionStorage.getItem("lp_intro_seen") && !still) d.classList.add("is-intro");
          else if (sessionStorage.getItem("lp_nav") && !still) d.classList.add("is-arriving");
          sessionStorage.removeItem("lp_nav");
        } catch (e) {}
        // 안전장치: 스크립트가 늦거나 실패해도 6초 뒤에는 첫 화면을 그대로 보여 줌
        setTimeout(function () {
          if (d.classList.contains("is-ready")) return;
          d.classList.add("is-ready");
          d.classList.remove("is-arriving");
          document.querySelectorAll("[data-hero]").forEach(function (n) {
            n.classList.add("is-inview");
          });
        }, 6000);
      })();
    </script>

    <!-- 글꼴: 한국어 Pretendard / 일본어 Noto Serif JP / 영어 · 숫자 Newsreader Display ExtraLight(대문자). 모두 assets/fonts에 직접 두고 필요한 글자 조각만 불러옴 (tools/build/fonts.cjs) -->
    <link rel="stylesheet" href="assets/css/fonts.css" />

    <!-- 공통 CSS (순서 중요) -->
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/pages.css" />
    <link rel="stylesheet" href="assets/css/ambient.css" />
  </head>
  <body>
    <div id="site-header"></div>

    <main id="main" tabindex="-1">

      <!-- 첫 화면: 가운데 정렬. 제목 → 한 줄 → 아래로 이어지는 금빛 세로선 -->
      <section class="pg-hero container" aria-labelledby="page-title">
        <h1 id="page-title" class="pg-title" data-reveal="lines" data-hero data-i18n="services.hero.title"></h1>
        <p class="pg-lead" data-reveal="rise" data-hero style="--d: 450ms" data-i18n="services.hero.lead"></p>
        <span class="pg-drop" data-reveal="drawy" data-hero style="--d: 900ms" aria-hidden="true"></span>
      </section>

      <!-- 서비스 아홉 가지: 줄을 누르면 대상 · 결과물 · 기간이 펼쳐짐 -->
      <section class="section section--tight">
        <div class="container">
          <ul class="rows" data-accordion data-stagger data-list="services.items">
            <template>
              <li class="acc-item" data-k-attr="id:id" data-reveal="rise" data-keep>
                <button class="acc-head" type="button" aria-expanded="false" aria-controls="">
                  <span class="acc-title" data-k="title"></span>
                  <span class="acc-sum" data-k="summary"></span>
                  <span class="acc-meta" data-k-attr="data-price:price;data-price-mode:mode"></span>
                  <span class="acc-icon" aria-hidden="true"></span>
                </button>
                <div class="acc-panel">
                  <div class="acc-inner">
                    <div class="acc-body svc-acc-body">
                      <div>
                        <p class="acc-lead" data-k="lead"></p>
                        <a class="text-link" data-k-attr="href:ask"><span data-i18n="services.labels.ask"></span><svg class="btn-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4" /></svg></a>
                      </div>
                      <dl class="defs">
                        <div>
                          <dt data-i18n="services.labels.for"></dt>
                          <dd><ul class="dots" data-k-list="for"><template><li data-k="."></li></template></ul></dd>
                        </div>
                        <div>
                          <dt data-i18n="services.labels.deliverables"></dt>
                          <dd><ul class="dots" data-k-list="deliverables"><template><li data-k="."></li></template></ul></dd>
                        </div>
                        <div>
                          <dt data-i18n="services.labels.duration"></dt>
                          <dd data-k="duration"></dd>
                        </div>
                      </dl>
                    </div>
                  </div>
                </div>
              </li>
            </template>
          </ul>
        </div>
      </section>

      <!-- 두 방향 -->
      <section class="section" aria-labelledby="dir-title">
        <div class="container">
          <div class="pg-head"><h2 id="dir-title" class="pg-h2" data-reveal="lines" data-i18n="services.directions.title"></h2></div>
          <div class="dir-grid" data-reveal="fade" data-stagger>
            <article class="dir" data-reveal="left">
              <div class="route" aria-hidden="true">KR<span class="poster-link"><span class="poster-track"><span data-reveal="draw" style="--d: 300ms"></span></span></span>JP</div>
              <h3 data-i18n="directions.kr_jp.title"></h3>
              <p data-i18n="directions.kr_jp.desc"></p>
              <ul class="dots" data-list="directions.kr_jp.points"><template><li data-k="."></li></template></ul>
            </article>
            <article class="dir" data-reveal="right">
              <div class="route" aria-hidden="true">JP<span class="poster-link"><span class="poster-track"><span data-reveal="draw" style="--d: 400ms"></span></span></span>KR</div>
              <h3 data-i18n="directions.jp_kr.title"></h3>
              <p data-i18n="directions.jp_kr.desc"></p>
              <ul class="dots" data-list="directions.jp_kr.points"><template><li data-k="."></li></template></ul>
            </article>
          </div>
        </div>
      </section>

      <!-- 진행 4단계 -->
      <section class="section" aria-labelledby="process-title">
        <div class="container">
          <div class="pg-head"><h2 id="process-title" class="pg-h2" data-reveal="lines" data-i18n="services.process.title"></h2></div>
          <ol class="steps" data-stagger data-list="process.steps">
            <template>
              <li data-reveal="zoom">
                <span class="step-line" data-reveal="draw" aria-hidden="true"></span>
                <h3 data-k="line"></h3>
                <p data-k="desc"></p>
                <p class="step-time" data-k="time"></p>
              </li>
            </template>
          </ol>
        </div>
      </section>

      <section class="closing" aria-labelledby="closing-title">
        <div class="container">
          <span class="closing-rule" data-reveal="draw" aria-hidden="true"></span>
          <div class="closing-body">
            <div class="closing-lead">
              <div>
                <h2 id="closing-title" class="sr-only" data-i18n="closing.title"></h2>
                <p class="closing-desc" data-reveal="rise" style="--d: 150ms" data-i18n="closing.desc"></p>
              </div>
              <p class="closing-clock" data-reveal="fade" style="--d: 250ms"><span class="live-dot" aria-hidden="true"></span><span data-closing-status></span><span class="closing-time num" data-closing-time></span><span data-i18n="closing.info.clock"></span></p>
            </div>
            <form class="quick-form" id="quick-form" novalidate data-reveal="rise" style="--d: 200ms">
              <div class="quick-grid">
                <div class="field">
                  <label class="field-label" for="q-name"><span data-i18n="contact.form.name"></span><span class="req" data-i18n="contact.form.required"></span></label>
                  <input class="input" id="q-name" name="name" type="text" autocomplete="name" required aria-describedby="q-name-hint" />
                  <p class="field-hint" id="q-name-hint" aria-live="polite"></p>
                </div>
                <div class="field">
                  <label class="field-label" for="q-email"><span data-i18n="contact.form.email"></span><span class="req" data-i18n="contact.form.required"></span></label>
                  <input class="input" id="q-email" name="email" type="email" autocomplete="email" required aria-describedby="q-email-hint" />
                  <p class="field-hint" id="q-email-hint" aria-live="polite"></p>
                </div>
                <div class="field span-2">
                  <label class="field-label" for="q-service" data-i18n="contact.form.services"></label>
                  <select class="input" id="q-service" name="service" data-list="services.items">
                    <option value="" data-i18n="closing.form.pick"></option>
                    <template><option data-k-attr="value:id" data-k="title"></option></template>
                  </select>
                </div>
                <div class="field span-2">
                  <label class="field-label" for="q-message"><span data-i18n="contact.form.message"></span><span class="req" data-i18n="contact.form.required"></span></label>
                  <textarea class="input" id="q-message" name="message" rows="4" required aria-describedby="q-message-hint" data-i18n-attr="placeholder:contact.form.message_placeholder"></textarea>
                  <p class="field-hint" id="q-message-hint" aria-live="polite"></p>
                </div>
                <div class="field span-2">
                  <label class="consent">
                    <input type="checkbox" name="consent" required aria-describedby="q-consent-hint" />
                    <span><span data-i18n="contact.form.consent"></span> <a class="inline-link" href="privacy.html" data-i18n="contact.form.consent_link"></a></span>
                  </label>
                  <p class="field-hint" id="q-consent-hint" aria-live="polite"></p>
                </div>
              </div>
              <div class="quick-submit">
                <button class="btn btn--primary" type="submit"><span class="roll"><span data-i18n="contact.form.submit"></span></span><svg class="btn-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4" /></svg></button>
                <p class="form-note" data-i18n="contact.form.note"></p>
              </div>
            </form>
          </div>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>

    <!-- 공통 JS (순서 중요) -->
    <script src="assets/js/config.js" defer></script>
    <script src="assets/js/components.js" defer></script>
    <script src="assets/js/i18n.js" defer></script>
    <script src="assets/js/intro.js" defer></script>
    <script src="assets/js/ambient.js" defer></script>
    <script src="assets/js/motion.js" defer></script>
    <script src="assets/js/pricing.js" defer></script>
    <script src="assets/js/site.js" defer></script>
    <script src="assets/js/ticker.js" defer></script>
    <script src="assets/js/main.js" defer></script>
  </body>
</html>
