<!doctype html>
<!-- 자동 생성 파일: src/cases.html 을 고친 뒤 tools/build 에서 npm run build -->
<html lang="en">
  <head>
    <meta charset="UTF-8"><meta content="default-src 'self'; script-src 'self' 'sha256-3tgS6NiBvlG5EjYI79ZLCmHSYpXotSZYP50TuxQnFRA='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.frankfurter.dev https://formspree.io; object-src 'none'; base-uri 'self'; form-action 'self'" http-equiv="Content-Security-Policy">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="meta.cases.title">Cases | LINKERPARTNERS</title>
    <meta name="description" content="How brands and startups crossed between Korea and Japan: the hurdles, what they did and the results, with sources." data-i18n-attr="content:meta.cases.description">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" href="../assets/logo/favicon.ico" sizes="any">
    <link rel="icon" href="../assets/logo/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="../assets/logo/favicon-48.png" type="image/png" sizes="48x48">
    <link rel="icon" href="../assets/logo/favicon-192.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="../assets/logo/apple-touch-icon.png">
    <script>
      (function () {
        var d = document.documentElement;
        d.classList.add("js");
        // 이 창에서 처음이면 인트로, 사이트 안에서 넘어왔으면 전환 막. 동작 줄이기 설정이면 둘 다 생략
        try {
          var still = matchMedia("(prefers-reduced-motion: reduce)").matches;
          if (!sessionStorage.getItem("lp_intro_seen") && !still) d.classList.add("is-intro");
          else if (sessionStorage.getItem("lp_nav") && !still) d.classList.add("is-arriving");
          sessionStorage.removeItem("lp_nav");
        } catch (e) {}
        // 안전장치: 스크립트가 늦거나 실패해도 6초 뒤에는 첫 화면을 그대로 보여 줌
        setTimeout(function () {
          if (d.classList.contains("is-ready")) return;
          d.classList.add("is-ready");
          d.classList.remove("is-arriving");
          document.querySelectorAll("[data-hero]").forEach(function (n) {
            n.classList.add("is-inview");
          });
        }, 6000);
      })();
    </script>

    <!-- 글꼴: 한국어 Pretendard / 일본어 Noto Serif JP / 영어 · 숫자 Newsreader Display ExtraLight(대문자). 모두 assets/fonts에 직접 두고 필요한 글자 조각만 불러옴 (tools/build/fonts.cjs) -->
    <link rel="stylesheet" href="../assets/css/fonts.css">

    <!-- 공통 CSS (순서 중요) -->
    <link rel="stylesheet" href="../assets/css/tokens.css">
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/pages.css">
    <link rel="stylesheet" href="../assets/css/ambient.css">
  <link href="https://linkerpartners.com/en/cases.html" rel="canonical"><link href="https://linkerpartners.com/cases.html" hreflang="ko" rel="alternate"><link href="https://linkerpartners.com/ja/cases.html" hreflang="ja" rel="alternate"><link href="https://linkerpartners.com/en/cases.html" hreflang="en" rel="alternate"><link href="https://linkerpartners.com/cases.html" hreflang="x-default" rel="alternate"><meta content="website" property="og:type"><meta content="LINKERPARTNERS" property="og:site_name"><meta content="Cases | LINKERPARTNERS" property="og:title"><meta content="How brands and startups crossed between Korea and Japan: the hurdles, what they did and the results, with sources." property="og:description"><meta content="https://linkerpartners.com/en/cases.html" property="og:url"><meta content="en_US" property="og:locale"><meta content="ko_KR" property="og:locale:alternate"><meta content="ja_JP" property="og:locale:alternate"><meta content="https://linkerpartners.com/assets/og-image.png" property="og:image"><meta content="1200" property="og:image:width"><meta content="630" property="og:image:height"><meta content="LINKERPARTNERS" property="og:image:alt"><meta content="summary_large_image" name="twitter:card"><meta content="aa0369991a68222c57cb7bfdd5a6c807b556212e" name="naver-site-verification"></head>
  <body>
    <div id="site-header"></div>

    <main id="main" tabindex="-1">

      <!-- 첫 화면: 가운데 정렬. 제목 → 한 줄 → 아래로 이어지는 금빛 세로선 -->
      <section class="pg-hero container" aria-labelledby="page-title">
        <h1 id="page-title" class="pg-title" data-reveal="lines" data-hero="" data-i18n="cases.hero.title"><span style="--l: 0" class="line"><span>How brands</span></span><span style="--l: 1" class="line"><span>make the move</span></span></h1>
        <p class="pg-lead" data-reveal="rise" data-hero="" style="--d: 450ms" data-i18n="cases.hero.lead">The routes small businesses and startups actually took between Korea and Japan, pieced together from public sources.</p>
        <span class="pg-drop" data-reveal="drawy" data-hero="" style="--d: 900ms" aria-hidden="true"></span>
      </section>

      <!-- 사례 갤러리: data/cases/의 사례를 영문 브랜드 이름 타일로 불규칙하게 (cases.js). 타일을 고르면 상세 보기가 열림 -->
      <section class="section section--tight" aria-labelledby="case-list-title">
        <div class="container">
          <h2 id="case-list-title" class="sr-only" data-i18n="home.work.title">Cases</h2>
          <div class="filter-top" data-reveal="drop">
            <div aria-label="Filter by direction" class="filter-bar" role="group" data-filter-for="case-gallery" data-i18n-attr="aria-label:cases.labels.filter">
              <button type="button" data-filter="all" aria-pressed="true" data-i18n="cases.labels.all">All</button>
              <button type="button" data-filter="kr_jp" aria-pressed="false" data-i18n="cases.labels.kr_jp">Korea → Japan</button>
              <button type="button" data-filter="jp_kr" aria-pressed="false" data-i18n="cases.labels.jp_kr">Japan → Korea</button>
            </div>
            <p class="filter-count" aria-live="polite"><span class="num" data-filter-count="case-gallery"></span> <span data-i18n="cases.labels.count">cases</span></p>
          </div>
          <ul class="case-gallery" id="case-gallery" data-case-gallery="" data-slots=""></ul>
        </div>
      </section>

      <section class="closing" aria-labelledby="closing-title">
        <div class="container">
          <span class="closing-rule" data-reveal="draw" aria-hidden="true"></span>
          <div class="closing-body">
            <div class="closing-lead">
              <div>
                <h2 id="closing-title" class="sr-only" data-i18n="closing.title">Contact us</h2>
                <p class="closing-desc" data-reveal="rise" style="--d: 150ms" data-i18n="closing.desc">Your first 30-minute call is free</p>
              </div>
              <p class="closing-clock" data-reveal="fade" style="--d: 250ms"><span class="live-dot" aria-hidden="true"></span><span data-closing-status=""></span><span class="closing-time num" data-closing-time=""></span><span data-i18n="closing.info.clock">Seoul&#160;· Tokyo time</span></p>
            </div>
            <form class="quick-form" id="quick-form" novalidate data-reveal="rise" style="--d: 200ms">
              <div class="quick-grid">
                <div class="field">
                  <label class="field-label" for="q-name"><span data-i18n="contact.form.name">Name</span><span class="req" data-i18n="contact.form.required">Required</span></label>
                  <input class="input" id="q-name" name="name" type="text" autocomplete="name" required aria-describedby="q-name-hint">
                  <p class="field-hint" id="q-name-hint" aria-live="polite"></p>
                </div>
                <div class="field">
                  <label class="field-label" for="q-email"><span data-i18n="contact.form.email">Email</span><span class="req" data-i18n="contact.form.required">Required</span></label>
                  <input class="input" id="q-email" name="email" type="email" autocomplete="email" required aria-describedby="q-email-hint">
                  <p class="field-hint" id="q-email-hint" aria-live="polite"></p>
                </div>
                <div class="field span-2">
                  <label class="field-label" for="q-service" data-i18n="contact.form.services">Services of interest</label>
                  <select class="input" id="q-service" name="service" data-list="services.items">
                    <option value="" data-i18n="closing.form.pick">Choose a service (optional)</option>
                    <template><option data-k-attr="value:id" data-k="title"></option></template>
                  <option data-gen="" value="spot" data-k-attr="value:id" data-k="title">1:1 focus session</option><option data-gen="" value="localization" data-k-attr="value:id" data-k="title">Brand localization and product pages</option><option data-gen="" value="advisory" data-k-attr="value:id" data-k="title">Monthly mentoring</option><option data-gen="" value="diagnostic" data-k-attr="value:id" data-k="title">Market-fit report</option><option data-gen="" value="logo" data-k-attr="value:id" data-k="title">Logo and brand design</option><option data-gen="" value="channel" data-k-attr="value:id" data-k="title">Store-launch guide</option><option data-gen="" value="sns" data-k-attr="value:id" data-k="title">Social media and ads support</option><option data-gen="" value="booking" data-k-attr="value:id" data-k="title">Booking system setup</option><option data-gen="" value="web" data-k-attr="value:id" data-k="title">Website development</option></select>
                </div>
                <div class="field span-2">
                  <label class="field-label" for="q-message"><span data-i18n="contact.form.message">Message</span><span class="req" data-i18n="contact.form.required">Required</span></label>
                  <textarea placeholder="The market you want to sell in, your product or service, and what is on your mind." class="input" id="q-message" name="message" rows="4" required aria-describedby="q-message-hint" data-i18n-attr="placeholder:contact.form.message_placeholder"></textarea>
                  <p class="field-hint" id="q-message-hint" aria-live="polite"></p>
                </div>
                <div class="field span-2">
                  <label class="consent">
                    <input type="checkbox" name="consent" required aria-describedby="q-consent-hint">
                    <span><span data-i18n="contact.form.consent">I agree to the collection and use of my personal&#160;data.</span> <a class="inline-link" href="privacy.html" data-i18n="contact.form.consent_link">Details</a></span>
                  </label>
                  <p class="field-hint" id="q-consent-hint" aria-live="polite"></p>
                </div>
              </div>
              <div class="quick-submit">
                <button class="btn btn--primary" type="submit"><span class="roll"><span data-i18n="contact.form.submit">Send request</span></span><svg class="btn-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4" /></svg></button>
                <p class="form-note" data-i18n="contact.form.note">Your message is delivered to our team by email.</p>
                <p class="form-status" role="status" aria-live="polite" data-form-status=""></p>
              </div>
              <div class="hp" aria-hidden="true"><label>Website<input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
            </form>
          </div>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>

    <!-- 공통 JS (순서 중요) -->
    <script src="../assets/js/config.js" defer></script>

    <script src="../assets/js/i18n.js" defer></script>

    <script src="../assets/js/ambient.js" defer></script>
    <script src="../assets/js/motion.js" defer></script>
    <script src="../assets/js/pricing.js" defer></script>
    <script src="../assets/js/cases.js" defer></script>
    <script src="../assets/js/site.js" defer></script>
    <script src="../assets/js/langbar.js" defer></script>
    <script src="../assets/js/ticker.js" defer></script>
    <script src="../assets/js/main.js" defer></script>
  </body>
</html>
